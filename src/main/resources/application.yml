spring:
  application:
    name: order-inventory-api

  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:orderinventorydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: OrderInventoryDevPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1800000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_inventory_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OrderInventoryPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
server:
  port: 8080

# Credentials below are intentionally NOT given defaults — every environment (including local dev)
# must supply them via environment variables rather than a committed value. See README.md >
# Configuration for the full list and how to set them.
app:
  security:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
    customer-username: ${CUSTOMER_USERNAME}
    customer-password: ${CUSTOMER_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ecommerce.orderinventory: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: test

# Fixture credentials for the automated test suite only, running against the H2 in-memory database
# that's torn down after each run. Not a real secret and never used by a deployed environment — see
# the Configuration section in README.md for how real environments supply these via env vars instead.
app:
  security:
    admin-username: test-admin
    admin-password: test-admin-pass
    customer-username: test-customer
    customer-password: test-customer-pass
